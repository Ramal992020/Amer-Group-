<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>الصفحة مش موجودة | Amer Group Holding</title>
    <meta name="theme-color" content="#181818" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #e30613;
        --base: #181818;
        --surface: #1f1f1f;
        --overlay: #313131;
        --muted: #b9b9b9;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--base);
        color: #ffffff;
        font-family: "Cairo", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 24px;
        text-align: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 480px;
        border: 1px solid var(--overlay);
        border-radius: 24px;
        background: var(--surface);
        padding: 48px 32px;
      }
      .code {
        font-size: 3.75rem;
        line-height: 1;
        font-weight: 600;
        color: var(--brand);
      }
      h1 { font-size: 1.5rem; line-height: 1.333; font-weight: 600; }
      p { font-size: 0.875rem; line-height: 1.428; color: var(--muted); }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--brand);
        color: #ffffff;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
      }
      a:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">٤٠٤</p>
      <h1>الصفحة مش موجودة</h1>
      <p>الرابط ده قديم أو غلط. ارجع للرئيسية واحجز معاينتك من هناك.</p>
      <a href="/landing.html">العودة إلى الرئيسية</a>
    </main>
  </body>
</html>
