    <!--
      Aggressive self-healing: this runs BEFORE the app bundle.
      It unregisters any service worker left behind by older builds
      (which served a cached connection-settings / Excel screen) and
      wipes every cache so the current login page is always shown.
    -->
    <script>
      (function () {
        try {
          if (window.caches) {
            caches
              .keys()
              .then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
              .catch(function () {});
          }
        } catch (e) {}
        try {
          if (navigator.serviceWorker) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                regs.forEach(function (reg) {
                  try { reg.unregister(); } catch (e) {}
                });
                // Reload once if an old worker was actually controlling us.
                if (regs.length && !localStorage.getItem('amer_sw_purged')) {
                  localStorage.setItem('amer_sw_purged', '1');
                  window.location.replace(
                    window.location.pathname + '?v=' + Date.now() + window.location.hash
                  );
                }
              })
              .catch(function () {});
          }
        } catch (e) {}
      })();
    </script>

  </body>
